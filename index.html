<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🍳 КУХНЯ • WHOPPER BAR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Courier New', monospace;
        }

        body {
            background: #0d0d0d;
            min-height: 100vh;
            padding: 20px;
        }

        .board {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #fec233;
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #c53a1f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .orders-list {
            background: #1a1a1a;
            border-radius: 30px;
            padding: 20px;
            min-height: 70vh;
            border: 2px solid #fec233;
        }

        .order-card {
            background: #2d2d2d;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 8px solid #ff9800;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .order-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fec233;
            background: #0d0d0d;
            display: inline-block;
            padding: 5px 25px;
            border-radius: 50px;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
        }

        .order-items {
            color: #ddd;
            font-size: 1rem;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #444;
        }

        .order-items span {
            display: inline-block;
            background: #c53a1f;
            padding: 5px 12px;
            border-radius: 30px;
            margin: 3px;
            font-size: 0.9rem;
        }

        .empty-message {
            text-align: center;
            color: #555;
            padding: 50px;
            font-size: 1.2rem;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 0.8rem;
        }

        .new-order {
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0% { background: #ff9800; transform: scale(1); }
            50% { background: #ffcc00; transform: scale(1.02); }
            100% { background: #2d2d2d; transform: scale(1); }
        }

        @media (max-width: 600px) {
            .order-number {
                font-size: 1.8rem;
                padding: 5px 15px;
            }
            .order-card {
                padding: 15px;
            }
        }

        .sound-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #fec233;
            color: #2d1d0c;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 100;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            z-index: 1000;
            animation: fadeOut 2s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>
    <div class="board">
        <h1>
            <i class="fas fa-utensils"></i>
            КУХНЯ
            <i class="fas fa-fire"></i>
        </h1>
        
        <div class="orders-list" id="ordersList">
            <div class="empty-message">
                <i class="fas fa-check-circle"></i> Нет активных заказов
            </div>
        </div>
        
        <div class="footer">
            <i class="fas fa-sync-alt fa-spin"></i> Автообновление • Все заказы в ресторане
        </div>
    </div>

    <button class="sound-toggle" id="soundToggle">
        <i class="fas fa-volume-up"></i>
    </button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBlZ5ZtyTXgtXxSJAx1jOxwhTrzlHRJmo",
            authDomain: "bk-cashier.firebaseapp.com",
            databaseURL: "https://bk-cashier-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bk-cashier",
            storageBucket: "bk-cashier.firebasestorage.app",
            messagingSenderId: "385000840969",
            appId: "1:385000840969:web:1ec8d09176b6551dc0fdd8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let previousOrderIds = new Set();
        let notificationEnabled = true;
        let audioContext = null;

        function playBeep() {
            if (!notificationEnabled) return;
            
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 880;
                gainNode.gain.value = 0.3;
                
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.5);
                oscillator.stop(audioContext.currentTime + 0.5);
                
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            } catch(e) {
                console.log('Звук не воспроизведён:', e);
            }
        }

        function showToast(message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function updateKitchenBoard() {
            db.ref('orders').once('value', (snapshot) => {
                const orders = snapshot.val() || {};
                const activeOrders = [];
                const currentOrderIds = new Set();

                // Все заказы в ресторане со статусом waiting (готовятся)
                Object.entries(orders).forEach(([id, order]) => {
                    if (order.orderType === 'restaurant' && order.status === 'waiting') {
                        activeOrders.push({ id, ...order });
                        currentOrderIds.add(id);
                    }
                });

                // Проверяем новые заказы
                let hasNewOrder = false;
                for (const id of currentOrderIds) {
                    if (!previousOrderIds.has(id)) {
                        hasNewOrder = true;
                        break;
                    }
                }

                if (hasNewOrder && notificationEnabled) {
                    playBeep();
                    showToast('🔔 НОВЫЙ ЗАКАЗ НА КУХНЮ!');
                }

                previousOrderIds = currentOrderIds;

                // Сортируем по времени (новые сверху)
                activeOrders.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                // Рендерим
                const container = document.getElementById('ordersList');
                
                if (activeOrders.length === 0) {
                    container.innerHTML = '<div class="empty-message"><i class="fas fa-check-circle"></i> Нет активных заказов</div>';
                } else {
                    container.innerHTML = activeOrders.map(order => `
                        <div class="order-card" data-order-id="${order.id}">
                            <div class="order-number">#${order.id}</div>
                            <div class="order-items">
                                ${order.items.map(item => `<span>${escapeHtml(item.name)} x${item.quantity}</span>`).join('')}
                            </div>
                        </div>
                    `).join('');
                    
                    // Анимация для нового заказа
                    if (hasNewOrder && container.firstChild) {
                        container.firstChild.classList.add('new-order');
                        setTimeout(() => {
                            if (container.firstChild) container.firstChild.classList.remove('new-order');
                        }, 500);
                    }
                }
            }).catch(error => {
                console.error('Ошибка:', error);
                document.getElementById('ordersList').innerHTML = '<div class="empty-message"><i class="fas fa-exclamation-triangle"></i> Ошибка подключения</div>';
            });
        }

        // Слушаем изменения
        function listenToChanges() {
            db.ref('orders').on('child_changed', () => updateKitchenBoard());
            db.ref('orders').on('child_added', () => updateKitchenBoard());
            db.ref('orders').on('child_removed', () => updateKitchenBoard());
        }

        // Звук
        function initSoundToggle() {
            const toggleBtn = document.getElementById('soundToggle');
            const icon = toggleBtn.querySelector('i');
            
            const saved = localStorage.getItem('kitchen_sound_enabled');
            if (saved === 'false') {
                notificationEnabled = false;
                icon.className = 'fas fa-volume-mute';
            }
            
            toggleBtn.addEventListener('click', () => {
                notificationEnabled = !notificationEnabled;
                localStorage.setItem('kitchen_sound_enabled', notificationEnabled);
                
                if (notificationEnabled) {
                    icon.className = 'fas fa-volume-up';
                    showToast('🔔 Звук ВКЛЮЧЁН');
                    playBeep();
                } else {
                    icon.className = 'fas fa-volume-mute';
                    showToast('🔕 Звук ВЫКЛЮЧЁН');
                }
            });
        }

        // Активация звука
        document.querySelector('h1').addEventListener('click', () => {
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
                showToast('🔊 Звук активирован');
            }
        });

        // Запуск
        function init() {
            updateKitchenBoard();
            listenToChanges();
            initSoundToggle();
            setInterval(updateKitchenBoard, 5000);
        }

        init();
    </script>
</body>
</html>
