<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовой помощник</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="assistant">
        <h1>Голосовой помощник</h1>

        <div class="status" id="status">Нажмите на микрофон или напишите сообщение</div>

        <button class="mic-btn" id="micBtn" aria-label="Говорить">
            <svg viewBox="0 0 24 24" width="48" height="48">
                <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5.3-3a5.3 5.3 0 0 1-10.6 0H4a7.3 7.3 0 0 0 6.7 7.2V21h2.6v-2.8A7.3 7.3 0 0 0 20 11h-2.7z"/>
            </svg>
        </button>

        <!-- Текстовый ввод -->
        <div class="text-input-row">
            <input type="text" id="textInput" placeholder="Напишите сообщение..." autocomplete="off" />
            <button id="sendBtn" aria-label="Отправить">→</button>
        </div>

        <div class="transcript" id="transcript"></div>
        <div class="response" id="response"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
